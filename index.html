            { "@type": "HowToStep", "name": "Set your dates", "text": "Choose your start and end dates. Use the winter arc (Oct 1 – Dec 31) or any window you want. If the arc is far away, start a warm-up today." },
            { "@type": "HowToStep", "name": "Pick habits", "text": "Pick 3–5 habits from templates or add your own. Keep it under 10." },

        {
          "@type": "FAQPage",
          "@id": "https://trywinterarc.vercel.app/#faq",
          "mainEntity": [
            { "@type": "Question", "name": "What is a winter arc?", "acceptedAnswer": { "@type": "Answer", "text": "A stretch of the colder months that you commit to a short list of daily habits. You mark each habit off every day. Missed days stay visible on the grid and there is no way to repair a streak." } },
            { "@type": "Question", "name": "Are the dates fixed?", "acceptedAnswer": { "@type": "Answer", "text": "No. October 1 through December 31 is the winter arc, and you can change the start and end dates to whatever window you want your arc to run." } },
            { "@type": "Question", "name": "Can I start before October?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. When the winter arc is still weeks away, setup offers a warm-up from today up to the day before it begins, so you build the habit instead of waiting. When it ends the tracker rolls you into the winter arc with the same habits and an empty grid. Your warm-up days stay in the browser and in both exports." } },
            { "@type": "Question", "name": "Can it remind me?", "acceptedAnswer": { "@type": "Answer", "text": "Yes, and it costs nothing. Set a morning time and an evening time, and the app raises a normal browser notification with your system sound. There is no push server, so they fire only while WinterArc is open in a tab or installed as an app. Rest days and finished days stay quiet. On iPhone they work once WinterArc is on your home screen." } },
